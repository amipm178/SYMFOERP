name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-and-symfony:
    name: Compose configuration and Symfony image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Build Symfony application image
        run: docker build --tag symfoerp-symfony:ci --file Dockerfile .

      - name: Check PHP syntax
        run: |
          docker run --rm symfoerp-symfony:ci sh -lc 'find src config public -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l'

      - name: Smoke test Symfony HTTP application
        run: |
          set -eu
          docker run --detach --rm --name symfoerp-symfony-smoke -e APP_ENV=dev -e APP_DEBUG=1 -e APP_SECRET=ci-smoke-test-secret -p 127.0.0.1:8000:8000 symfoerp-symfony:ci
          cleanup() {
            docker stop symfoerp-symfony-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8000/ --output /tmp/symfoerp-home.html; then
              grep -q "Tiers &amp; CRM\\|Tiers & CRM" /tmp/symfoerp-home.html
              curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8000/healthz --output /tmp/symfoerp-health.json
              grep -q '"status":"ok"' /tmp/symfoerp-health.json
              echo "Symfony dashboard and health endpoint responded successfully."
              exit 0
            fi
            sleep 2
          done
          docker logs symfoerp-symfony-smoke
          echo "Symfony HTTP smoke test failed." >&2
          exit 1

      - name: Apply and validate Symfony database migration
        run: |
          set -eu
          docker compose --env-file .env.docker up --detach symfony
          docker compose --env-file .env.docker exec --no-TTY symfony php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.docker exec --no-TTY symfony php bin/console doctrine:schema:validate
          if ! curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8000/third-parties --output /tmp/symfoerp-third-parties.html; then
            docker compose --env-file .env.docker logs symfony
            docker compose --env-file .env.docker exec --no-TTY symfony sh -lc 'tail -n 100 var/log/dev.log || true'
            exit 1
          fi
          grep -q "Aucun tiers enregistré dans Symfony" /tmp/symfoerp-third-parties.html
          echo "Symfony third-party list rendered successfully."

      - name: Smoke test fresh Dolibarr installation
        run: |
          set -eu
          cleanup() {
            docker compose --env-file .env.docker down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose --env-file .env.docker up --detach db_dolibarr dolibarr
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:8080/ --output /tmp/symfoerp-dolibarr.html; then
              if grep -qi "Dolibarr" /tmp/symfoerp-dolibarr.html; then
                echo "Fresh Dolibarr installation responded successfully."
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose --env-file .env.docker logs dolibarr db_dolibarr
          echo "Fresh Dolibarr HTTP smoke test failed." >&2
          exit 1
